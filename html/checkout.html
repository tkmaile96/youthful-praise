<section id="page-checkout" class="page hidden">
      <button class="back-btn" onclick="showPage('home')">← Back to event</button>
      <h2>Checkout</h2>
      <div class="checkout-layout">
        <div class="checkout-form-card">
          <h3>Request tickets</h3>
          <form id="checkout-form" onsubmit="processPayment(event)">
            <div class="form-row">
              <label>Full name</label>
              <input type="text" id="buyer-name" required maxlength="120" placeholder="Jane Doe" />
            </div>
            <div class="form-row">
              <label>Account email</label>
              <input type="email" id="buyer-email" readonly />
            </div>
            <div class="form-row">
              <label>Phone</label>
              <input type="tel" id="buyer-phone" placeholder="+27 79 000 0000" />
            </div>

            <p class="hint mt-4">This sends a request to the event team. Tickets are issued only after an administrator approves it and confirms payment.</p>
            <button type="submit" class="btn btn-primary btn-full" id="pay-btn">
              Submit ticket request
            </button>
          </form>
        </div>

        <div class="order-summary-card">
          <h3>Order summary</h3>
          <div id="order-summary">
            <!-- filled by JS -->
          </div>
          <p class="eft-note">Your request will remain pending until the event team confirms payment and approves it.</p>
        </div>
      </div>
    </section>
